<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Ma Base - Battle Royale</title>
    <link rel="stylesheet" href="stile.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="notification-global.css">
    <link rel="stylesheet" href="cofreenpiere.css">
    <style>
        .btn-retour {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            z-index: 100;
        }

        .btn-retour:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
        }

        .compteur-pieces-base {
            position: absolute;
            top: 20px;
            left: 180px;
            background: rgba(255, 215, 0, 0.95);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }

        .nom-joueur-base {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .icone-piece-nom {
            font-size: 28px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
        }

        .stats-container {
            position: absolute;
            bottom: 30px;
            display: flex;
            width: 100%;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .stats-gauche {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, rgba(44, 62, 80, 0.95), rgba(52, 73, 94, 0.95));
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 3px solid rgba(243, 156, 18, 0.8);
            min-width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .stat-label {
            font-size: 40px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7));
        }

        .stat-icon {
            font-size: 28px;
        }

        .stat-value {
            font-size: 38px;
            font-weight: bold;
            color: #f39c12;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
            background: linear-gradient(to bottom, #ffd700, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .base-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
        }

        /* Responsive mobile */
        @media (max-width: 768px) {
            .btn-retour {
                top: 10px;
                left: 10px;
                padding: 8px 15px;
                font-size: 12px;
            }

            .compteur-pieces-base {
                top: 10px;
                left: 10px;
                padding: 8px 15px;
                font-size: 16px;
                position: relative;
                display: inline-block;
                margin-bottom: 10px;
            }

            .nom-joueur-base {
                top: 10px;
                right: 10px;
                padding: 8px 15px;
                font-size: 14px;
                gap: 8px;
            }

            .icone-piece-nom {
                font-size: 18px;
            }

            .stats-container {
                bottom: 15px;
                padding: 0 10px;
                flex-direction: column;
                gap: 10px;
            }

            .stats-gauche {
                gap: 10px;
                width: 100%;
                justify-content: space-around;
            }

            .stat-box {
                padding: 15px;
                min-width: 80px;
                gap: 8px;
            }

            .stat-label {
                font-size: 28px;
            }

            .stat-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <button class="btn-retour" onclick="window.location.href='index.html'">← Retour</button>

    <div class="compteur-pieces-base">
        🪙 <span id="pieces-base">0</span>
    </div>

    <div class="nom-joueur-base" id="nom-joueur-base">
        <span class="icone-piece-nom">🪙</span>
        <span>Joueur</span>
    </div>

    <div class="stats-container">
        <div class="stats-gauche">
            <div class="stat-box">
                <div class="stat-label">🔫</div>
                <div class="stat-value" id="fusils-prets">0</div>
            </div>

            <div class="stat-box">
                <div class="stat-label">🛡️</div>
                <div class="stat-value" id="niveau-bouclier">1</div>
            </div>
        </div>

        <div class="stat-box">
            <div class="stat-label">🏗️</div>
            <div class="stat-value" id="nombre-bases">1</div>
        </div>
    </div>

    <!-- Bouton roue de récompenses (petit) -->
    <button class="btn-roue-mini" id="btn-roue-mini">
        <div class="roue-mini-icon">🎁</div>
        <div class="roue-mini-timer" id="roue-mini-timer">0:00</div>
    </button>

    <!-- Modal de la roue de récompenses -->
    <div class="modal" id="modal-roue" style="display: none;">
        <div class="modal-content-roue">
            <span class="modal-close" id="modal-close-roue">&times;</span>
            <h2>⏰ Roue de Récompenses</h2>
            
            <div class="paliers-container">
                <!-- Palier 1: 30s -->
                <div class="palier-card" id="palier-0">
                    <div class="palier-header">
                        <span class="palier-icon">🎁</span>
                        <div class="palier-info">
                            <div class="palier-titre">Coffre Bronze</div>
                            <div class="palier-temps">Temps : 30 secondes</div>
                        </div>
                        <div class="palier-status" id="status-0">🔒</div>
                    </div>
                    <div class="palier-progress">
                        <div class="progress-bar-palier">
                            <div class="progress-fill-palier" id="progress-0"></div>
                        </div>
                    </div>
                    <button class="btn-reclamer-palier" id="btn-palier-0" style="display: none;">Réclamer</button>
                </div>

                <!-- Palier 2: 2min -->
                <div class="palier-card" id="palier-1">
                    <div class="palier-header">
                        <span class="palier-icon">🪙</span>
                        <div class="palier-info">
                            <div class="palier-titre">20 Pièces d'Or</div>
                            <div class="palier-temps">Temps : 2 minutes</div>
                        </div>
                        <div class="palier-status" id="status-1">🔒</div>
                    </div>
                    <div class="palier-progress">
                        <div class="progress-bar-palier">
                            <div class="progress-fill-palier" id="progress-1"></div>
                        </div>
                    </div>
                    <button class="btn-reclamer-palier" id="btn-palier-1" style="display: none;">Réclamer</button>
                </div>

                <!-- Palier 3: 4min -->
                <div class="palier-card" id="palier-2">
                    <div class="palier-header">
                        <span class="palier-icon">🪙</span>
                        <div class="palier-info">
                            <div class="palier-titre">30 Pièces d'Or</div>
                            <div class="palier-temps">Temps : 4 minutes</div>
                        </div>
                        <div class="palier-status" id="status-2">🔒</div>
                    </div>
                    <div class="palier-progress">
                        <div class="progress-bar-palier">
                            <div class="progress-fill-palier" id="progress-2"></div>
                        </div>
                    </div>
                    <button class="btn-reclamer-palier" id="btn-palier-2" style="display: none;">Réclamer</button>
                </div>

                <!-- Palier 4: 7min -->
                <div class="palier-card" id="palier-3">
                    <div class="palier-header">
                        <span class="palier-icon">🎁</span>
                        <div class="palier-info">
                            <div class="palier-titre">3 Coffres Bronze</div>
                            <div class="palier-temps">Temps : 7 minutes</div>
                        </div>
                        <div class="palier-status" id="status-3">🔒</div>
                    </div>
                    <div class="palier-progress">
                        <div class="progress-bar-palier">
                            <div class="progress-fill-palier" id="progress-3"></div>
                        </div>
                    </div>
                    <button class="btn-reclamer-palier" id="btn-palier-3" style="display: none;">Réclamer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal coffre -->
    <div class="modal" id="modal-coffre" style="display: none;">
        <div class="modal-content">
            <!-- Confettis -->
            <div class="confetti-container">
                <div class="confetti" style="--i:1; --color:#ff6b6b">🎊</div>
                <div class="confetti" style="--i:2; --color:#4ecdc4">🎉</div>
                <div class="confetti" style="--i:3; --color:#ffd93d">💰</div>
                <div class="confetti" style="--i:4; --color:#6bcf7f">🪙</div>
                <div class="confetti" style="--i:5; --color:#a29bfe">✨</div>
                <div class="confetti" style="--i:6; --color:#fd79a8">🎊</div>
                <div class="confetti" style="--i:7; --color:#fdcb6e">🎉</div>
                <div class="confetti" style="--i:8; --color:#74b9ff">💫</div>
                <div class="confetti" style="--i:9; --color:#55efc4">🪙</div>
                <div class="confetti" style="--i:10; --color:#ff7675">💰</div>
            </div>
            
            <!-- Étoiles -->
            <div class="stars-container">
                <span class="star" style="--i:1">⭐</span>
                <span class="star" style="--i:2">✨</span>
                <span class="star" style="--i:3">💫</span>
                <span class="star" style="--i:4">⭐</span>
                <span class="star" style="--i:5">✨</span>
                <span class="star" style="--i:6">💫</span>
                <span class="star" style="--i:7">⭐</span>
                <span class="star" style="--i:8">✨</span>
            </div>
            
            <!-- Cercle de lumière -->
            <div class="light-circle"></div>
            
            <h2>🎁 Coffre Bronze 🎁</h2>
            
            <!-- Coffre avec animation d'ouverture -->
            <div class="coffre-wrapper">
                <div class="coffre-animation" id="coffre-box">
                    <div class="coffre-top">📦</div>
                    <div class="coffre-bottom">📦</div>
                    <div class="treasure-burst">
                        <span>💰</span>
                        <span>🪙</span>
                        <span>💎</span>
                        <span>✨</span>
                        <span>🪙</span>
                        <span>💰</span>
                    </div>
                </div>
            </div>
            
            <!-- Rayons de lumière -->
            <div class="rays-container">
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
                <div class="ray"></div>
            </div>
            
            <!-- Particules de pièces -->
            <div class="coins-particles">
                <span class="coin-particle" style="--i:1">🪙</span>
                <span class="coin-particle" style="--i:2">🪙</span>
                <span class="coin-particle" style="--i:3">🪙</span>
                <span class="coin-particle" style="--i:4">🪙</span>
                <span class="coin-particle" style="--i:5">🪙</span>
                <span class="coin-particle" style="--i:6">🪙</span>
            </div>
            
            <p id="coffre-resultat"></p>
            <button id="btn-ok-coffre">✨ Récupérer ✨</button>
        </div>
    </div>

    <script src="base.js"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBavSNizC3V3WcyN3snmSlzUMX5s8DYbJM",
            authDomain: "ami-combat.firebaseapp.com",
            databaseURL: "https://ami-combat-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ami-combat",
            storageBucket: "ami-combat.firebasestorage.app",
            messagingSenderId: "902577363403",
            appId: "1:902577363403:web:70d778cc7dc3e1c519fe4e"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseSet = set;
        window.firebasePush = push;
        window.firebaseOnValue = onValue;
        window.firebaseReady = true;
    </script>
    
    <script src="notification-global.js"></script>
</body>
</html>
