<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amis - Battle Royale</title>
    <link rel="stylesheet" href="stile.css">
    <link rel="stylesheet" href="ami.css">
</head>
<body>
    <button class="btn-retour" onclick="window.location.href='index.html'">← Retour</button>

    <!-- Mon QR Code en haut à gauche -->
    <div class="mon-qrcode">
        <div class="qrcode-titre">Mon QR Code</div>
        <div id="qrcode-container"></div>
    </div>

    <!-- Bouton lancer partie -->
    <button class="btn-lancer-partie" id="btn-lancer-partie">
        🎮 Lancer la partie
    </button>

    <!-- Liste des amis -->
    <div class="liste-amis" id="liste-amis">
        <h2>Mes Amis</h2>
        <div id="amis-container">
            <p class="aucun-ami">Aucun ami pour le moment. Ajoutez-en !</p>
        </div>
    </div>

    <!-- Modal de confirmation -->
    <div class="modal" id="modal-confirmation" style="display: none;">
        <div class="modal-content">
            <h2>✅ Succès !</h2>
            <p id="message-confirmation">Demande d'ami envoyée à : <span id="nom-destinataire"></span></p>
            <button id="btn-ok-confirmation">OK</button>
        </div>
    </div>

    <!-- Modal renommer ami -->
    <div class="modal" id="modal-renommer" style="display: none;">
        <div class="modal-content">
            <h2>👤 Renommer cet ami ?</h2>
            <p>Nom actuel : <span id="nom-actuel-ami"></span></p>
            <input type="text" id="input-nouveau-nom" placeholder="Nouveau nom (optionnel)">
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btn-garder-nom" style="flex: 1;">Garder</button>
                <button id="btn-confirmer-nom" style="flex: 1;">Renommer</button>
            </div>
        </div>
    </div>

    <!-- Modal invitations reçues -->
    <div class="modal" id="modal-invitations" style="display: none;">
        <div class="modal-content">
            <span class="modal-close" id="modal-close-invitations">&times;</span>
            <h2>📬 Invitations reçues</h2>
            <div id="liste-invitations"></div>
        </div>
    </div>

    <!-- Modal notification de partie -->
    <div class="modal" id="modal-notification-partie" style="display: none;">
        <div class="modal-content">
            <h2>🎮 Invitation à jouer !</h2>
            <p id="message-partie"></p>
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <button id="btn-accepter-partie" style="flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; background: linear-gradient(135deg, #00cc00, #009900); color: white; cursor: pointer;">✓ Accepter</button>
                <button id="btn-refuser-partie" style="flex: 1; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; background: linear-gradient(135deg, #ff4444, #cc0000); color: white; cursor: pointer;">✗ Refuser</button>
            </div>
        </div>
    </div>

    <!-- Notification d'invitations -->
    <div class="notification-invitations" id="notification-invitations" style="display: none;">
        <span>🔔 Nouvelles invitations !</span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBavSNizC3V3WcyN3snmSlzUMX5s8DYbJM",
            authDomain: "ami-combat.firebaseapp.com",
            databaseURL: "https://ami-combat-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ami-combat",
            storageBucket: "ami-combat.firebasestorage.app",
            messagingSenderId: "902577363403",
            appId: "1:902577363403:web:70d778cc7dc3e1c519fe4e"
        };

        // Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        // Rendre disponible globalement
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseSet = set;
        window.firebasePush = push;
        window.firebaseOnValue = onValue;
        window.firebaseReady = true;
    </script>
    
    <script>
        // Attendre que la page soit complètement chargée
        function initialiser() {
            // Récupérer ou générer le code unique du joueur
            let monCode = localStorage.getItem('monCodeAmi');
            if (!monCode) {
                // Générer un code aléatoire à 3 chiffres (100-999)
                monCode = Math.floor(100 + Math.random() * 900).toString();
                localStorage.setItem('monCodeAmi', monCode);
            }

            // Rendre disponible globalement
            window.monCode = monCode;

            // Récupérer le nom du joueur
            const nomJoueur = localStorage.getItem('nomJoueur') || 'Joueur';
            window.nomJoueur = nomJoueur;

            // Générer le QR Code (attendre que QRCode soit chargé)
            setTimeout(function() {
                if (typeof QRCode !== 'undefined') {
                    const qrcodeUrl = `${window.location.origin}${window.location.pathname}?code=${monCode}&nom=${encodeURIComponent(nomJoueur)}`;
                    
                    const qrcode = new QRCode(document.getElementById('qrcode-container'), {
                        text: qrcodeUrl,
                        width: 150,
                        height: 150,
                        colorDark: "#000000",
                        colorLight: "#ffffff",
                        correctLevel: QRCode.CorrectLevel.H
                    });
                } else {
                    console.error('QRCode non chargé');
                }
            }, 100);
            }, 100);

            // Variable temporaire pour l'ami en attente
            window.amiEnAttente = null;

            // Vérifier si on arrive avec un code (scan QR ou lien)
            const urlParams = new URLSearchParams(window.location.search);
            const codeRecu = urlParams.get('code');
            const nomRecu = urlParams.get('nom');

            if (codeRecu && nomRecu && codeRecu !== monCode) {
                // Vérifier si déjà ami
                const amis = JSON.parse(localStorage.getItem('mesAmis')) || [];
                const dejaAmi = amis.find(ami => ami.code === codeRecu);
                
                if (dejaAmi) {
                    alert('Vous êtes déjà ami avec ' + nomRecu + ' ! 😊');
                    window.history.replaceState({}, document.title, window.location.pathname);
                } else {
                    // Attendre que Firebase soit prêt
                    setTimeout(() => {
                        // Envoyer une demande d'ami via Firebase avec ID unique
                        if (window.firebaseReady && window.firebaseDB) {
                            const uniqueId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                            const demandeRef = window.firebasePush(window.firebaseRef(window.firebaseDB, 'demandes_ami/' + codeRecu));
                            window.firebaseSet(demandeRef, {
                                de: nomJoueur,
                                code: monCode,
                                timestamp: Date.now(),
                                uniqueId: uniqueId
                            });
                        }
                    
                        // Demander si on veut renommer avant d'ajouter
                        window.amiEnAttente = { nom: nomRecu, code: codeRecu };
                        document.getElementById('nom-actuel-ami').textContent = nomRecu;
                        document.getElementById('modal-renommer').style.display = 'flex';
                        
                        // Nettoyer l'URL
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }, 1500);
                }
            }
        }
        
        //  Appeler l'initialisation quand la page est chargée
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialiser);
        } else {
            initialiser();
        }

        // Fonction pour envoyer une invitation
        function envoyerInvitation(codeDestinataire, expediteur, codeExpediteur) {
            let invitations = JSON.parse(localStorage.getItem('invitations_' + codeDestinataire)) || [];
            invitations.push({
                de: expediteur,
                code: codeExpediteur,
                date: Date.now()
            });
            localStorage.setItem('invitations_' + codeDestinataire, JSON.stringify(invitations));
        }

        // Vérifier les invitations au chargement
        function verifierInvitations() {
            const invitations = JSON.parse(localStorage.getItem('invitations_' + window.monCode)) || [];
            const notifElement = document.getElementById('notification-invitations');
            
            if (invitations.length > 0) {
                notifElement.style.display = 'flex';
                const texte = invitations.length === 1 
                    ? '🔔 1 nouvelle invitation !' 
                    : `🔔 ${invitations.length} nouvelles invitations !`;
                notifElement.querySelector('span').textContent = texte;
            } else {
                notifElement.style.display = 'none';
            }
        }
        verifierInvitations();
        
        // Vérifier régulièrement les nouvelles invitations (toutes les 3 secondes)
        setInterval(() => {
            verifierInvitations();
        }, 3000);

        // Clic sur notification
        document.getElementById('notification-invitations').addEventListener('click', function() {
            afficherInvitations();
            this.style.display = 'none';
        });

        // Afficher les invitations
        function afficherInvitations() {
            const invitations = JSON.parse(localStorage.getItem('invitations_' + window.monCode)) || [];
            const liste = document.getElementById('liste-invitations');
            
            if (invitations.length === 0) {
                liste.innerHTML = '<p class="aucun-ami">Aucune invitation</p>';
            } else {
                liste.innerHTML = '';
                invitations.forEach((inv, index) => {
                    const invDiv = document.createElement('div');
                    invDiv.className = 'invitation-card';
                    invDiv.innerHTML = `
                        <div class="invitation-info">
                            <p><strong>${inv.de}</strong> veut devenir ami avec toi ! 👋</p>
                        </div>
                        <div class="invitation-actions">
                            <button class="btn-accepter" onclick="accepterInvitation(${index})">✓ Accepter</button>
                            <button class="btn-refuser" onclick="refuserInvitation(${index})">✗ Refuser</button>
                        </div>
                    `;
                    liste.appendChild(invDiv);
                });
            }
            
            document.getElementById('modal-invitations').style.display = 'flex';
        }

        // Accepter une invitation
        function accepterInvitation(index) {
            const invitations = JSON.parse(localStorage.getItem('invitations_' + window.monCode)) || [];
            const invitation = invitations[index];
            
            // Vérifier si on n'est pas déjà ami
            const amis = JSON.parse(localStorage.getItem('mesAmis')) || [];
            const dejaAmi = amis.find(ami => ami.code === invitation.code);
            
            if (dejaAmi) {
                alert('Vous êtes déjà ami avec cette personne !');
                invitations.splice(index, 1);
                localStorage.setItem('invitations_' + window.monCode, JSON.stringify(invitations));
                afficherInvitations();
                return;
            }
            
            // Demander si on veut renommer
            window.amiEnAttente = { nom: invitation.de, code: invitation.code };
            document.getElementById('nom-actuel-ami').textContent = invitation.de;
            document.getElementById('modal-invitations').style.display = 'none';
            document.getElementById('modal-renommer').style.display = 'flex';
            verifierInvitations();
            
            // Retirer l'invitation
            invitations.splice(index, 1);
            localStorage.setItem('invitations_' + window.monCode, JSON.stringify(invitations));
            localStorage.setItem('invitations_' + window.monCode, JSON.stringify(invitations));
            
            // Mettre à jour l'affichage de la notification
            verifierInvitations();
        }

        // Refuser une invitation
        function refuserInvitation(index) {
            const invitations = JSON.parse(localStorage.getItem('invitations_' + window.monCode)) || [];
            invitations.splice(index, 1);
            localStorage.setItem('invitations_' + window.monCode, JSON.stringify(invitations));
            afficherInvitations();
        }

        // Fermer modal invitations
        document.getElementById('modal-close-invitations').addEventListener('click', function() {
            document.getElementById('modal-invitations').style.display = 'none';
        });

        // Garder le nom original
        document.getElementById('btn-garder-nom').addEventListener('click', function() {
            if (window.amiEnAttente) {
                ajouterAmi(window.amiEnAttente.nom, window.amiEnAttente.code);
                document.getElementById('modal-renommer').style.display = 'none';
                document.getElementById('input-nouveau-nom').value = '';
                window.amiEnAttente = null;
            }
        });

        // Renommer et ajouter
        document.getElementById('btn-confirmer-nom').addEventListener('click', function() {
            if (window.amiEnAttente) {
                const nouveauNom = document.getElementById('input-nouveau-nom').value.trim();
                const nomFinal = nouveauNom || window.amiEnAttente.nom;
                ajouterAmi(nomFinal, window.amiEnAttente.code);
                document.getElementById('modal-renommer').style.display = 'none';
                document.getElementById('input-nouveau-nom').value = '';
                window.amiEnAttente = null;
            }
        });

        // Fermer la confirmation
        document.getElementById('btn-ok-confirmation').addEventListener('click', function() {
            document.getElementById('modal-confirmation').style.display = 'none';
        });

        // Fonction pour ajouter un ami
        function ajouterAmi(nom, code) {
            let amis = JSON.parse(localStorage.getItem('mesAmis')) || [];
            
            // Vérifier si l'ami existe déjà
            const dejaAmi = amis.find(ami => ami.code === code);
            if (!dejaAmi) {
                amis.push({ nom: nom, code: code });
                localStorage.setItem('mesAmis', JSON.stringify(amis));
                afficherAmis();
                
                // Confirmation avec le bon ID (erreur de typo corrigée)
                document.getElementById('message-confirmation').textContent = `${nom} a été ajouté à vos amis ! 🎉`;
                document.getElementById('modal-confirmation').style.display = 'flex';
            } else {
                alert('Vous êtes déjà ami avec cette personne !');
            }
        }

        // Fonction pour afficher les amis
        function afficherAmis() {
            const amis = JSON.parse(localStorage.getItem('mesAmis')) || [];
            const container = document.getElementById('amis-container');
            
            if (amis.length === 0) {
                container.innerHTML = '<p class="aucun-ami">Aucun ami pour le moment. Ajoutez-en !</p>';
            } else {
                container.innerHTML = '';
                amis.forEach((ami, index) => {
                    const amiDiv = document.createElement('div');
                    amiDiv.className = 'ami-card';
                    amiDiv.innerHTML = `
                        <div class="ami-info">
                            <div class="ami-avatar">👤</div>
                            <div class="ami-details">
                                <div class="ami-nom">${ami.nom}</div>
                            </div>
                        </div>
                        <button class="btn-supprimer" onclick="supprimerAmi(${index})">🗑️</button>
                    `;
                    container.appendChild(amiDiv);
                });
            }
        }

        // Fonction pour supprimer un ami
        function supprimerAmi(index) {
            if (confirm('Voulez-vous vraiment supprimer cet ami ?')) {
                let amis = JSON.parse(localStorage.getItem('mesAmis')) || [];
                const amiSupprime = amis[index];
                amis.splice(index, 1);
                
                // Nettoyer les traces Firebase pour permettre de réinviter
                localStorage.removeItem('lastSeenDemande_' + amiSupprime.code);
                localStorage.removeItem('lastSeenNotification_' + amiSupprime.code);
                
                localStorage.setItem('mesAmis', JSON.stringify(amis));
                afficherAmis();
            }
        }

        // ==== SYSTÈME DE NOTIFICATIONS FIREBASE ====
        
        // Écouter les demandes d'ami en temps réel
        setTimeout(() => {
            if (window.firebaseDB && window.firebaseRef && window.firebaseOnValue) {
                const demandesRef = window.firebaseRef(window.firebaseDB, 'demandes_ami/' + window.monCode);
                
                window.firebaseOnValue(demandesRef, (snapshot) => {
                    const demandes = snapshot.val();
                    if (demandes) {
                        // Récupérer la dernière demande
                        const keys = Object.keys(demandes);
                        const lastKey = keys[keys.length - 1];
                        const lastDemande = demandes[lastKey];
                        
                        // Vérifier si on a déjà vu cette demande avec ID unique
                        const uniqueKey = lastDemande.uniqueId || lastKey;
                        const lastSeenDemande = localStorage.getItem('lastSeenDemande_all');
                        
                        if (uniqueKey !== lastSeenDemande && lastDemande.code !== window.monCode) {
                            // Nouvelle demande d'ami !
                            localStorage.setItem('lastSeenDemande_all', uniqueKey);
                            
                            // Vérifier si pas déjà ami
                            const amis = JSON.parse(localStorage.getItem('mesAmis')) || [];
                            const dejaAmi = amis.find(ami => ami.code === lastDemande.code);
                            
                            if (!dejaAmi) {
                                // Ajouter automatiquement comme ami
                                amis.push({ nom: lastDemande.de, code: lastDemande.code });
                                localStorage.setItem('mesAmis', JSON.stringify(amis));
                                afficherAmis();
                                
                                // Notification
                                alert(`✅ Vous êtes maintenant ami avec ${lastDemande.de} ! 🎉`);
                            }
                        }
                    }
                });
                
                // Écouter les notifications de partie
                const notificationsRef = window.firebaseRef(window.firebaseDB, 'notifications/' + window.monCode);
                
                window.firebaseOnValue(notificationsRef, (snapshot) => {
                    const notifications = snapshot.val();
                    if (notifications) {
                        // Récupérer la dernière notification
                        const keys = Object.keys(notifications);
                        const lastKey = keys[keys.length - 1];
                        const lastNotif = notifications[lastKey];
                        
                        // Vérifier si on a déjà vu cette notification
                        const lastSeenNotif = localStorage.getItem('lastSeenNotification');
                        if (lastKey !== lastSeenNotif) {
                            // Nouvelle notification !
                            localStorage.setItem('lastSeenNotification', lastKey);
                            afficherNotificationPartie(lastNotif.de, lastNotif.message);
                        }
                    }
                });
            }
        }, 1000);

        // Bouton lancer la partie
        document.getElementById('btn-lancer-partie').addEventListener('click', function() {
            const amis = JSON.parse(localStorage.getItem('mesAmis')) || [];
            
            if (amis.length === 0) {
                alert('Vous n\'avez pas encore d\'amis !\nAjoutez des amis pour lancer une partie.');
                return;
            }

            // Envoyer une notification à tous les amis
            if (window.firebaseDB && window.firebaseRef && window.firebasePush && window.firebaseSet) {
                amis.forEach(ami => {
                    const notificationRef = window.firebasePush(window.firebaseRef(window.firebaseDB, 'notifications/' + ami.code));
                    window.firebaseSet(notificationRef, {
                        de: window.nomJoueur,
                        message: 'La partie va commencer !',
                        timestamp: Date.now()
                    });
                });

                alert(`🎮 Invitation envoyée à ${amis.length} ami(s) !\n\nVos amis vont recevoir une notification.`);
            } else {
                alert('Erreur : Firebase non initialisé. Rechargez la page.');
            }
        });

        // Afficher la notification de partie
        function afficherNotificationPartie(nomAmi, message) {
            document.getElementById('message-partie').textContent = `${nomAmi} vous invite !\n\n"${message}"`;
            document.getElementById('modal-notification-partie').style.display = 'flex';
            
            // Son de notification (optionnel)
            try {
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZii0GHW7A7+OZRA0PVqzn7KdbFAg+l93zvmccBSaB0PLaiiwGHW/A7+OYQw0QVqzn7KdbFApBnt3ywWcbBS6Bz/Ljiz8GGnTD7+aUQQ0NVqzn67BbFAk+l93zvmcdBSaB0PLaiSwGH2/A7+OYRg0NWKzn66lbFAk+mN7zvmkbBSmB0PLbiisFH2/C7uOXRQ0PWK7n66lbFQo+l93z');
                audio.play().catch(() => {});
            } catch(e) {}
        }

        // Bouton accepter partie
        document.getElementById('btn-accepter-partie').addEventListener('click', function() {
            document.getElementById('modal-notification-partie').style.display = 'none';
            window.location.href = 'game.html';
        });

        // Bouton refuser partie
        document.getElementById('btn-refuser-partie').addEventListener('click', function() {
            document.getElementById('modal-notification-partie').style.display = 'none';
        });
                localStorage.setItem('mesAmis', JSON.stringify(amis));
                afficherAmis();
            }
        }

        // Afficher les amis au chargement
        afficherAmis();

        // Permettre d'appuyer sur Entrée pour renommer
        document.getElementById('input-nouveau-nom').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('btn-confirmer-nom').click();
            }
        });
    </script>
</body>
</html>
