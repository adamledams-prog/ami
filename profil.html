<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - Battle Royale</title>
    <link rel="stylesheet" href="stile.css">
    <link rel="stylesheet" href="notification-global.css">
    <style>
        .profil-header {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profil-nom {
            padding: 18px 30px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            color: #333;
        }

        .btn-trophee {
            width: 70px;
            height: 70px;
            font-size: 36px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.9);
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-trophee:hover {
            background: rgba(255, 215, 0, 1);
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-inventaire {
            position: absolute;
            bottom: 20px;
            left: 20px;
            padding: 18px 35px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-inventaire:hover {
            background: linear-gradient(135deg, #764ba2, #667eea);
            transform: scale(1.08);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.6);
        }

        /* Modal inventaire */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content-inventaire {
            background: linear-gradient(135deg, #fff9e6, #ffffff);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            max-height: 70vh;
            overflow-y: auto;
            position: relative;
            border: 3px solid #667eea;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 32px;
            color: #999;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-close:hover {
            color: #333;
            transform: scale(1.2) rotate(90deg);
        }

        .modal-content-inventaire h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 26px;
            text-align: center;
        }

        #inventaire-liste {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .inventaire-item {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
            border-left: 4px solid #667eea;
        }

        .inventaire-icon {
            font-size: 36px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .inventaire-info {
            flex: 1;
        }

        .inventaire-nom {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .inventaire-desc {
            font-size: 12px;
            color: #666;
        }

        .inventaire-quantite {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            background: rgba(102, 126, 234, 0.2);
            padding: 8px 15px;
            border-radius: 10px;
        }

        .inventaire-vide {
            text-align: center;
            color: #999;
            font-size: 16px;
            padding: 40px 20px;
            font-style: italic;
        }

        .cartes-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .carte {
            width: 150px;
            height: 220px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .carte::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -100%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, 
                transparent 30%, 
                rgba(255, 255, 255, 0.8) 50%, 
                transparent 70%);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0%, 100% {
                transform: translateX(-100%) translateY(-100%);
            }
            50% {
                transform: translateX(100%) translateY(100%);
            }
        }

        .carte::after {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            pointer-events: none;
        }

        .carte:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
        }

        .carte:active {
            transform: translateY(-5px) scale(1.02);
        }

        .carte-rouge {
            background: linear-gradient(135deg, #ff0000, #cc0000);
        }

        .carte-orange {
            background: linear-gradient(135deg, #ff8800, #cc6600);
        }

        .carte-bleu {
            background: linear-gradient(135deg, #0088ff, #0066cc);
        }

        .carte-vert {
            background: linear-gradient(135deg, #00ff00, #00cc00);
        }

        .carte-jaune {
            background: linear-gradient(135deg, #ffff00, #cccc00);
        }

        .btn-retour {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
        }

        .btn-retour:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
        }

        /* Responsive mobile */
        @media (max-width: 768px) {
            .btn-retour {
                top: 10px;
                left: 10px;
                padding: 8px 15px;
                font-size: 12px;
            }

            .profil-header {
                top: 10px;
                right: 10px;
                gap: 10px;
            }

            .profil-nom {
                padding: 8px 15px;
                font-size: 14px;
            }

            .btn-trophee {
                width: 45px;
                height: 45px;
                font-size: 24px;
            }

            .btn-inventaire {
                bottom: 10px;
                left: 10px;
                padding: 10px 20px;
                font-size: 14px;
                gap: 5px;
            }

            .modal-content-inventaire {
                padding: 20px;
                max-height: 80vh;
            }

            .modal-content-inventaire h2 {
                font-size: 20px;
                margin-bottom: 15px;
            }

            .inventaire-item {
                padding: 12px;
                gap: 12px;
            }

            .inventaire-icon {
                font-size: 28px;
                width: 40px;
                height: 40px;
            }

            .inventaire-nom {
                font-size: 14px;
            }

            .inventaire-desc {
                font-size: 11px;
            }

            .inventaire-quantite {
                font-size: 16px;
                padding: 6px 12px;
            }

            .cartes-container {
                bottom: 20px;
                gap: 12px;
            }

            .carte {
                width: 100px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <!-- Robot Pixi guide -->
    <div class="robot-guide" style="position: fixed; bottom: 20px; right: 20px; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.95); border-radius: 50%; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); z-index: 1000; animation: float 3s ease-in-out infinite;">
        <div class="robot-icon" style="font-size: 35px;">🤖</div>
    </div>
    
    <!-- Message du robot -->
    <div id="robot-message-profil" style="position: fixed; top: 90px; left: 50%; transform: translateX(-50%) translateY(-150%); background: white; padding: 15px 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3); z-index: 999; font-size: 16px; color: #333; font-weight: 500; transition: transform 0.5s ease-out; max-width: 400px; text-align: center;"></div>
    
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .show-message {
            transform: translateX(-50%) translateY(0) !important;
        }
    </style>
    
    <button class="btn-retour" onclick="window.location.href='index.html'">← Retour</button>

    <div class="profil-header">
        <div class="profil-nom" id="profil-nom">Joueur</div>
        <button class="btn-trophee">🏆</button>
    </div>

    <div class="cartes-container">
        <div class="carte carte-rouge"></div>
        <div class="carte carte-orange"></div>
        <div class="carte carte-bleu"></div>
        <div class="carte carte-vert"></div>
        <div class="carte carte-jaune"></div>
    </div>

    <button class="btn-inventaire" id="btn-inventaire">🎒 Inventaire</button>

    <!-- Modal inventaire -->
    <div class="modal" id="modal-inventaire" style="display: none;">
        <div class="modal-content-inventaire">
            <span class="modal-close" id="modal-close-inventaire">&times;</span>
            <h2>🎒 Mon Inventaire</h2>
            <div id="inventaire-liste"></div>
        </div>
    </div>

    <script>
        // Récupérer le nom depuis localStorage

        // Bouton inventaire
        document.getElementById('btn-inventaire').addEventListener('click', function() {
            afficherInventaire();
        });

        // Fermer modal inventaire
        document.getElementById('modal-close-inventaire').addEventListener('click', function() {
            document.getElementById('modal-inventaire').style.display = 'none';
        });

        // Fonction pour afficher l'inventaire
        function afficherInventaire() {
            const liste = document.getElementById('inventaire-liste');
            
            // Récupérer les quantités depuis localStorage
            const potionInvisibilite3s = parseInt(localStorage.getItem('potionInvisibilite3s')) || 0;
            const potionInvisibilite5s = parseInt(localStorage.getItem('potionInvisibilite5s')) || 0;
            const potionInvisibilite7s = parseInt(localStorage.getItem('potionInvisibilite7s')) || 0;
            const potionVitesse1_5x = parseInt(localStorage.getItem('potionVitesse1_5x')) || 0;
            const potionVitesse2x = parseInt(localStorage.getItem('potionVitesse2x')) || 0;
            const potionVitesse2_5x = parseInt(localStorage.getItem('potionVitesse2_5x')) || 0;
            const carteDecouvreur = parseInt(localStorage.getItem('carteDecouvreur')) || 0;
            
            // Définir les items avec leurs infos
            const items = [
                { quantite: potionInvisibilite3s, nom: 'Invisibilité 3s', desc: 'Durée : 3 secondes', icon: '👻' },
                { quantite: potionInvisibilite5s, nom: 'Invisibilité 5s', desc: 'Durée : 5 secondes', icon: '👻' },
                { quantite: potionInvisibilite7s, nom: 'Invisibilité 7s', desc: 'Durée : 7 secondes', icon: '👻' },
                { quantite: potionVitesse1_5x, nom: 'Vitesse 1.5x', desc: '3s - Vitesse x1.5', icon: '⚡' },
                { quantite: potionVitesse2x, nom: 'Vitesse 2x', desc: '3s - Vitesse x2', icon: '⚡' },
                { quantite: potionVitesse2_5x, nom: 'Vitesse 2.5x', desc: '3s - Vitesse x2.5', icon: '⚡' },
                { quantite: carteDecouvreur, nom: 'Carte Découvreur', desc: 'Révèle la carte complète', icon: '🗺️' }
            ];
            
            // Vérifier si l'inventaire est vide
            const totalItems = items.reduce((sum, item) => sum + item.quantite, 0);
            
            if (totalItems === 0) {
                liste.innerHTML = '<div class="inventaire-vide">Votre inventaire est vide.<br>Ouvrez des coffres ou achetez dans la boutique !</div>';
            } else {
                liste.innerHTML = '';
                
                // Afficher chaque item qui a une quantité > 0
                items.forEach(item => {
                    if (item.quantite > 0) {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = 'inventaire-item';
                        itemDiv.innerHTML = `
                            <div class="inventaire-icon">${item.icon}</div>
                            <div class="inventaire-info">
                                <div class="inventaire-nom">${item.nom}</div>
                                <div class="inventaire-desc">${item.desc}</div>
                            </div>
                            <div class="inventaire-quantite">×${item.quantite}</div>
                        `;
                        liste.appendChild(itemDiv);
                    }
                });
            }
            
            document.getElementById('modal-inventaire').style.display = 'flex';
        }
        const nomStocke = localStorage.getItem('nomJoueur');
        if (nomStocke) {
            document.getElementById('profil-nom').textContent = nomStocke;
        }

        // Récupérer la couleur sauvegardée
        const couleurSauvee = localStorage.getItem('couleurNom');
        if (couleurSauvee) {
            document.getElementById('profil-nom').style.background = couleurSauvee;
        }

        // Gestion des clics sur les cartes
        const cartes = document.querySelectorAll('.carte');
        cartes.forEach(carte => {
            carte.addEventListener('click', function() {
                let couleur = '';
                
                if (this.classList.contains('carte-rouge')) {
                    couleur = 'linear-gradient(135deg, #ff0000, #cc0000)';
                } else if (this.classList.contains('carte-orange')) {
                    couleur = 'linear-gradient(135deg, #ff8800, #cc6600)';
                } else if (this.classList.contains('carte-bleu')) {
                    couleur = 'linear-gradient(135deg, #0088ff, #0066cc)';
                } else if (this.classList.contains('carte-vert')) {
                    couleur = 'linear-gradient(135deg, #00ff00, #00cc00)';
                } else if (this.classList.contains('carte-jaune')) {
                    couleur = 'linear-gradient(135deg, #ffff00, #cccc00)';
                }
                
                // Appliquer la couleur
                document.getElementById('profil-nom').style.background = couleur;
                
                // Sauvegarder dans localStorage
                localStorage.setItem('couleurNom', couleur);
                
                // Animation de confirmation
                this.style.transform = 'scale(1.15)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 200);
            });
        });    </script>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBavSNizC3V3WcyN3snmSlzUMX5s8DYbJM",
            authDomain: "ami-combat.firebaseapp.com",
            databaseURL: "https://ami-combat-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ami-combat",
            storageBucket: "ami-combat.firebasestorage.app",
            messagingSenderId: "902577363403",
            appId: "1:902577363403:web:70d778cc7dc3e1c519fe4e"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseSet = set;
        window.firebasePush = push;
        window.firebaseOnValue = onValue;
        window.firebaseReady = true;
    </script>
    
    <script src="notification-global.js"></script>
    
    <!-- Script pour afficher le message du robot -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Vérifier si c'est la première fois sur Profil
            const aVuProfil = localStorage.getItem('aVuProfil');
            
            if (!aVuProfil) {
                // Afficher le message après un court délai
                setTimeout(() => {
                    const messageEl = document.getElementById('robot-message-profil');
                    messageEl.textContent = 'Choisis ton fond d\'écran';
                    messageEl.classList.add('show-message');
                    
                    // Masquer le message après 5 secondes
                    setTimeout(() => {
                        messageEl.classList.remove('show-message');
                        
                        // Marquer comme vu
                        localStorage.setItem('aVuProfil', 'true');
                    }, 5000);
                }, 500);
            }
        });
    </script>
</body>
</html>
